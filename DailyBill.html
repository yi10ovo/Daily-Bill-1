body::before{content:"";position:fixed;inset:0;background:rgba(250,250,251,.34);z-index:-1}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-bd);box-shadow:0 8px 32px rgba(120,125,132,.14)}

header{padding:26px 18px 6px;text-align:center}
.brand{font-size:22px;letter-spacing:3px;color:#9aa0a6;font-weight:800}
.month{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:14px;color:var(--sub);font-size:14px}
.month button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(150,155,160,.5);background:var(--glass);color:var(--text);font-size:17px;backdrop-filter:blur(8px);line-height:1}

.balance{text-align:center;margin-top:14px;padding:0 18px}
.balance .label{font-size:11px;letter-spacing:3px;color:var(--sub);text-transform:uppercase}
.balance .val{font-size:42px;font-weight:800;margin-top:4px;letter-spacing:-1px;word-break:break-all}
.balance .val.neg{color:var(--exp)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px}
.card{border-radius:20px;padding:16px;text-align:center}
.card .t{font-size:11px;color:var(--sub);letter-spacing:2px}
.card .v{font-size:20px;font-weight:800;margin-top:8px}
.card.exp .v{color:var(--exp)}
.card.inc .v{color:var(--inc)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6);color:#5c6168;font-size:13px;backdrop-filter:blur(8px);transition:.15s}
.chip.on{background:var(--gray-btn);color:#fff;border-color:transparent;transform:scale(1.04)}
.chip img{width:18px;height:18px;border-radius:5px;object-fit:cover;background:#fff}

.section-head{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 6px;color:var(--sub);font-size:11px;letter-spacing:2px}
.list{padding:0 18px}
.day-group{margin-bottom:14px}
.day-title{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:8px 0;letter-spacing:.5px}
.item{border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:9px}
.item .icon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:0 0 auto;overflow:hidden;padding:5px;border:1px solid rgba(255,255,255,.7)}
.item .icon img{width:100%;height:100%;object-fit:contain;border-radius:7px}
.item .info{flex:1;min-width:0}
.item .info .cat{font-weight:700;font-size:15px}
.item .info .note{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:800;font-size:16px;flex:0 0 auto}
.item.exp .amt{color:var(--exp)}
.item.inc .amt{color:var(--inc)}

.chart-wrap{padding:6px 18px 24px}
.stat-card{border-radius:20px;padding:16px;margin-bottom:12px}
.stat-card h4{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:1px;margin-bottom:6px}
.donut-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;border-radius:50%;flex:0 0 auto;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}
.donut .center b{font-size:17px}
.donut .center span{font-size:10px;color:var(--sub);letter-spacing:1px}
.legend{flex:1;min-width:140px;font-size:13px}
.legend .lg{display:flex;align-items:center;gap:6px;margin:6px 0}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.legend .lg .nm{color:var(--text)}
.legend .lg .vl{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.bar-row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13px}
.bar-row .nm{width:56px;flex:0 0 auto;display:flex;align-items:center;gap:5px;color:var(--text)}
.bar-row .nm img{width:16px;height:16px;border-radius:4px;object-fit:cover}
.bar-track{flex:1;height:12px;background:rgba(0,0,0,.05);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
.bar-row .vl{width:64px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 auto}
.trend{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:8px}
.trend .col{flex:1;border-radius:6px 6px 0 0;min-height:4px;position:relative}
.trend .col span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.trend .col i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--sub);font-style:normal}
.trend-labels{display:flex;gap:5px;margin-top:22px;font-size:10px;color:var(--sub)}
.trend-labels span{flex:1;text-align:center}

.bottom-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;border-radius:999px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav-tab{color:var(--sub);font-size:12px;letter-spacing:1px;font-weight:600;padding:6px 10px;border-radius:999px}
.nav-tab.on{background:rgba(255,255,255,.6);color:var(--gray-btn)}
.fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#9aa0a6,#6e747a);color:#fff;font-size:34px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(90,96,102,.4);border:1px solid rgba(255,255,255,.5);cursor:pointer;line-height:1;margin-top:-26px}

.overlay{position:fixed;inset:0;background:rgba(60,64,70,.3);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-end;z-index:200;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.overlay.show{display:flex}
.sheet{width:100%;max-width:480px;border-radius:28px 28px 20px 20px;padding:22px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:19px;margin-bottom:16px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.row label{width:44px;font-size:13px;color:var(--sub);flex:0 0 auto}
.row input,.row select{flex:1;padding:12px;border-radius:13px;border:1px solid rgba(255,255,255,.6);font-size:16px;background:rgba(255,255,255,.6);color:var(--text);min-width:0;outline:none}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:15px;border:none;font-size:15px;font-weight:700;cursor:pointer}
.btn-primary{background:#6e747a;color:#fff}
.btn-ghost{background:rgba(255,255,255,.5);color:var(--sub)}
.btn-danger{background:#e07b6d;color:#fff}
.action-sheet{width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px}
.action-sheet button{width:100%;padding:16px;border:none;background:rgba(255,255,255,.45);border-bottom:1px solid rgba(0,0,0,.04);font-size:16px;cursor:pointer;text-align:center}
.action-sheet button:first-child{border-radius:14px 14px 0 0}
.action-sheet button:last-child{border-bottom:none;border-radius:0 0 14px 14px}
.action-sheet .act-edit{color:#5c6168;font-weight:600}
.action-sheet .act-del{color:#e07b6d;font-weight:600}
.action-sheet .act-cancel{color:#8a8f95;font-weight:600;margin-top:10px;border-radius:14px}
.confirm-box{position:fixed;inset:0;background:rgba(60,64,70,.4);display:none;justify-content:center;align-items:center;z-index:300;backdrop-filter:blur(4px)}
.confirm-box.show{display:flex}
.confirm-inner{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:24px;width:84%;max-width:320px;text-align:center}
.confirm-inner h4{font-size:17px;margin-bottom:8px}
.confirm-inner p{font-size:13px;color:var(--sub);margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(60,64,70,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:400;display:none;white-space:nowrap}
.toast.show{display:block}
.empty{text-align:center;color:var(--sub);padding:34px;font-size:14px;line-height:1.7}
@media (max-width:360px){.balance .val{font-size:34px}.item .icon{width:40px;height:40px}.brand{font-size:19px}}
</style>
</head>
<body>
<div class="wrap" id="homePage">
<header>
  <div class="brand">DAILY BILL</div>
  <div class="month">
    <button onclick="prevMonth()">&#8249;</button>
    <span id="monthLabel"></span>
    <button onclick="nextMonth()">&#8250;</button>
  </div>
</header>
<div class="balance">
  <div class="label">BALANCE</div>
  <div class="val" id="balanceVal">0.00</div>
</div>
<div class="cards">
  <div class="card glass exp"><div class="t">EXPENSE</div><div class="v" id="expVal">-0.00</div></div>
  <div class="card glass inc"><div class="t">INCOME</div><div class="v" id="incVal">+0.00</div></div>
</div>
<div class="chips" id="chipBox"></div>
<div class="section-head"><span>RECORDS</span><span id="metaText"></span></div>
<div class="list" id="listBox"></div>
</div>

<div class="wrap" id="chartPage" style="display:none">
<header><div class="brand">DAILY BILL</div></header>
<div class="chart-wrap">
  <div class="stat-card glass">
    <h4>EXPENSE / INCOME</h4>
    <div class="donut-box">
      <div class="donut" id="donut"></div>
      <div class="legend" id="donutLegend"></div>
    </div>
  </div>
  <div class="stat-card glass">
    <h4>CATEGORY BREAKDOWN</h4>
    <div id="catBars"></div>
  </div>
  <div class="stat-card glass">
    <h4>LAST 7 DAYS</h4>
    <div class="trend" id="trend"></div>
    <div class="trend-labels" id="trendLbl"></div>
  </div>
</div>
</div>

<div class="bottom-nav glass">
  <div class="nav-tab on" data-p="home" onclick="switchPage('home')">BILLS</div>
  <button class="fab" onclick="openAdd()">+</button>
  <div class="nav-tab" data-p="chart" onclick="switchPage('chart')">STATS</div>
</div>

<div class="overlay" id="editOverlay">
  <div class="sheet glass">
    <h3 id="editTitle">New Record</h3>
    <div class="row"><label>Type</label>
      <select id="typeSel" onchange="onTypeChange()"><option value="exp">Expense 支出</option><option value="inc">Income 收入</option></select>
    </div>
    <div class="row"><label>Amount</label><input id="amtIn" type="number" inputmode="decimal" placeholder="0.00"></div>
    <div class="chips" id="editChips" style="padding-left:0"></div>
    <div class="row"><label>Date</label><input id="dateIn" type="date"></div>
    <div class="row"><label>Note</label><input id="noteIn" placeholder="optional"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBill()">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="actionOverlay">
  <div class="action-sheet">
    <button class="act-edit" onclick="doEdit()">&#9998; Edit 编辑</button>
    <button class="act-del" onclick="doDelete()">&#128465; Delete 删除</button>
    <button class="act-cancel" onclick="closeAction()">Cancel 取消</button>
  </div>
</div>

<div class="confirm-box" id="confirmBox">
  <div class="confirm-inner">
    <h4>Delete this record?</h4>
    <p>删除后无法恢复</p>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

var EXP_CATS = ["购物","娱乐","餐饮","电费","宿舍","出行"];
var INC_CATS = ["工资","兼职","理财","红包","其他"];
var CAT_COLORS = {"购物":"#c9a9c4","娱乐":"#a9c4d8","餐饮":"#e0b9a0","电费":"#b8c4a9","宿舍":"#d8c9b8","出行":"#b0b0b8","其他":"#bdbdbd"};

var bills = JSON.parse(localStorage.getItem("daily_bill_v1") || "[]");
var curYm = new Date(); curYm.setDate(1);
var curType = "exp", curCat = "购物", curPage = "home";
var editId = null, actId = null;

function fmt(n){ return Number(n).toFixed(2); }
function ymKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function ymText(d){ return (d.getMonth()+1) + " / " + d.getFullYear(); }
function sameYm(b, ym){ return ymKey(new Date(b.date)) === ym; }
function icon(cat){ return ICONS[cat] || ICONS["其他"] || ICONS["宿舍"]; }
function wday(ts){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(ts).getDay()]; }

function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1400);
}

function render(){
  document.getElementById("monthLabel").textContent = ymText(curYm);
  var ym = ymKey(curYm);
  var ls = bills.filter(function(b){ return sameYm(b, ym); }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  var exp = 0, inc = 0;
  ls.forEach(function(b){ if(b.type==="exp") exp += b.amount; else inc += b.amount; });
  var bal = inc - exp;
  var bv = document.getElementById("balanceVal");
  bv.textContent = (bal>=0?"":"-") + fmt(Math.abs(bal));
  bv.className = "val" + (bal<0?" neg":"");
  document.getElementById("expVal").textContent = "-" + fmt(exp);
  document.getElementById("incVal").textContent = "+" + fmt(inc);
  document.getElementById("metaText").textContent = ls.length + " items";

  renderChips();

  var box = document.getElementById("listBox"); box.innerHTML = "";
  if(ls.length === 0){ box.innerHTML = '<div class="empty">No records this month.<br>Tap + to add one.</div>'; return; }

  var groups = {};
  ls.forEach(function(b){
    var k = new Date(b.date).toDateString();
    if(!groups[k]) groups[k] = [];
    groups[k].push(b);
  });
  Object.keys(groups).forEach(function(k){
    var arr = groups[k]; var d = new Date(arr[0].date);
    var de=0, di=0;
    arr.forEach(function(b){ if(b.type==="exp") de+=b.amount; else di+=b.amount; });
    var g = document.createElement("div"); g.className = "day-group";
    g.innerHTML = '<div class="day-title"><span>'+d.getDate()+' '+(d.getMonth()+1)+' · '+wday(d.getTime())+'</span><span style="color:var(--exp)">-'+fmt(de)+'</span> / <span style="color:var(--inc)">+'+fmt(di)+'</span></div>';
    arr.forEach(function(b){
      var item = document.createElement("div"); item.className = "item glass";
      item.innerHTML = '<div class="icon"><img src="'+icon(b.cat)+'" alt=""></div>'
        + '<div class="info"><div class="cat">'+b.cat+'</div>'+(b.note?'<div class="note">'+b.note+'</div>':'')+'</div>'
        + '<div class="amt '+(b.type==="exp"?"exp":"inc")+'">'+(b.type==="exp"?"-":"+")+fmt(b.amount)+'</div>';
      item.setAttribute("onclick", "openAction("+b.id+")");
      g.appendChild(item);
    });
    box.appendChild(g);
  });
}

function chipHTML(c, active){
  return '<div class="chip'+(active?" on":"")+'" onclick="pickCat(\''+c+'\')"><img src="'+icon(c)+'" alt="">'+c+'</div>';
}
function renderChips(){
  var box = document.getElementById("chipBox");
  var cats = curType === "exp" ? EXP_CATS : INC_CATS;
  box.innerHTML = cats.map(function(c){ return chipHTML(c, curCat===c); }).join("");
}
function renderEditChips(){
  var box = document.getElementById("editChips");
  var cats = curType === "exp" ? EXP_CATS : INC_CATS;
  box.innerHTML = cats.map(function(c){ return chipHTML(c, curCat===c); }).join("");
}
function pickCat(c){
  curCat = c;
  if(document.getElementById("editOverlay").classList.contains("show")) renderEditChips();
  else { renderChips(); render(); }
}
function onTypeChange(){
  curType = document.getElementById("typeSel").value;
  curCat = curType === "exp" ? "购物" : "工资";
  renderEditChips();
}

function renderChart(){
  var ym = ymKey(curYm);
  var ls = bills.filter(function(b){ return sameYm(b, ym); });
  var exp = 0, inc = 0;
  ls.forEach(function(b){ if(b.type==="exp") exp += b.amount; else inc += b.amount; });

  var total = exp + inc || 1;
  var er = exp/total*360, ir = inc/total*360;
  var donut = document.getElementById("donut");
  donut.style.background = "conic-gradient(var(--exp) 0 "+er+"deg, var(--inc) "+er+" "+(er+ir)+"deg, rgba(0,0,0,.06) "+(er+ir)+"deg 360deg)";
  donut.innerHTML = '<div class="center"><div><b>'+fmt(Math.abs(inc-exp))+'</b><br><span>BALANCE</span></div></div>';
  document.getElementById("donutLegend").innerHTML =
    '<div class="lg"><span class="dot" style="background:var(--exp)"></span><span class="nm">Expense</span><span class="vl">'+fmt(exp)+'</span></div>' +
    '<div class="lg"><span class="dot" style="background:var(--inc)"></span><span class="nm">Income</span><span class="vl">'+fmt(inc)+'</span></div>';

  var byCat = {};
  ls.forEach(function(b){
    if(!byCat[b.cat]) byCat[b.cat] = {exp:0, inc:0};
    byCat[b.cat][b.type] += b.amount;
  });
  var arr = Object.keys(byCat).map(function(k){ var v=byCat[k]; return {cat:k, t:v.exp+v.inc, exp:v.exp, inc:v.inc}; })
    .sort(function(a,b){ return b.t - a.t; });
  var maxT = Math.max.apply(null, arr.map(function(x){ return x.t; }).concat([1]));
  var cb = document.getElementById("catBars"); cb.innerHTML = "";
  if(arr.length === 0){ cb.innerHTML = '<div class="empty" style="padding:14px">No data</div>'; }
  arr.forEach(function(x){
    var color = x.exp > 0 ? (CAT_COLORS[x.cat] || "#bdbdbd") : "var(--inc)";
    var pct = x.t/maxT*100;
    cb.innerHTML += '<div class="bar-row"><span class="nm"><img src="'+icon(x.cat)+'" alt="">'+x.cat+'</span>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
      + '<span class="vl">'+fmt(x.t)+'</span></div>';
  });

  var tr = document.getElementById("trend"), tl = document.getElementById("trendLbl");
  tr.innerHTML = ""; tl.innerHTML = "";
  var maxAmt = 1;
  for(var i=6;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var ds = d.toDateString();
    var db = ls.filter(function(b){ return new Date(b.date).toDateString()===ds; });
    var de = db.filter(function(b){ return b.type==="exp"; }).reduce(function(a,b){ return a+b.amount; },0);
    var di = db.filter(function(b){ return b.type==="inc"; }).reduce(function(a,b){ return a+b.amount; },0);
    maxAmt = Math.max(maxAmt, de, di, 1);
  }
  for(var i=6;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var ds = d.toDateString();
    var db = ls.filter(function(b){ return new Date(b.date).toDateString()===ds; });
    var de = db.filter(function(b){ return b.type==="exp"; }).reduce(function(a,b){ return a+b.amount; },0);
    var di = db.filter(function(b){ return b.type==="inc"; }).reduce(function(a,b){ return a+b.amount; },0);
    var h = 6 + (de+di)/maxAmt*100;
    tr.innerHTML += '<div class="col" style="height:'+h+'px;background:'+(de>=di?'var(--exp)':'var(--inc)')+'"><i>'+(de+di>0?fmt(de+di):'')+'</i><span>'+(d.getMonth()+1)+'/'+d.getDate()+'</span></div>';
    tl.innerHTML += '<span>'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
  }
}

function switchPage(p){
  curPage = p;
  document.getElementById("homePage").style.display = p==="chart" ? "none" : "";
  document.getElementById("chartPage").style.display = p==="chart" ? "" : "none";
  document.querySelectorAll(".nav-tab").forEach(function(t){
    t.classList.toggle("on", t.dataset.p === p);
  });
  if(p==="chart") renderChart();
}

function openAdd(){
  editId = null; curType = "exp"; curCat = "购物";
  document.getElementById("editTitle").textContent = "New Record";
  document.getElementById("typeSel").value = "exp";
  document.getElementById("amtIn").value = "";
  document.getElementById("dateIn").value = new Date().toISOString().slice(0,10);
  document.getElementById("noteIn").value = "";
  renderEditChips();
  document.getElementById("editOverlay").classList.add("show");
}
function openEdit(id){
  editId = id;
  var b = bills.find(function(x){ return x.id===id; });
  curType = b.type; curCat = b.cat;
  document.getElementById("editTitle").textContent = "Edit Record";
  document.getElementById("typeSel").value = b.type;
  document.getElementById("amtIn").value = b.amount;
  document.getElementById("dateIn").value = new Date(b.date).toISOString().slice(0,10);
  document.getElementById("noteIn").value = b.note || "";
  renderEditChips();
  document.getElementById("editOverlay").classList.add("show");
  closeAction();
}
function closeEdit(){ document.getElementById("editOverlay").classList.remove("show"); }
function saveBill(){
  var amt = parseFloat(document.getElementById("amtIn").value);
  if(!amt || amt <= 0){ toast("Enter a valid amount"); return; }
  var date = document.getElementById("dateIn").value;
  var note = document.getElementById("noteIn").value.trim();
  if(editId){
    var b = bills.find(function(x){ return x.id===editId; });
    if(b){ b.type=curType; b.cat=curCat; b.amount=amt; b.date=date; b.note=note; }
    toast("Updated");
  } else {
    bills.push({id:Date.now(), type:curType, cat:curCat, amount:amt, date:date, note:note});
    toast("Saved");
  }
  localStorage.setItem("daily_bill_v1", JSON.stringify(bills));
  closeEdit(); render();
}

function openAction(id){ actId = id; document.getElementById("actionOverlay").classList.add("show"); }
function closeAction(){ document.getElementById("actionOverlay").classList.remove("show"); }
function doEdit(){ var b=bills.find(function(x){ return x.id===actId; }); if(b) openEdit(b.id); }
function doDelete(){ closeAction(); document.getElementById("confirmBox").classList.add("show"); }
function closeConfirm(){ document.getElementById("confirmBox").classList.remove("show"); }
function confirmDelete(){
  bills = bills.filter(function(x){ return x.id!==actId; });
  localStorage.setItem("daily_bill_v1", JSON.stringify(bills));
  document.getElementById("confirmBox").classList.remove("show");
  render(); toast("Deleted");
}

function prevMonth(){ curYm.setMonth(curYm.getMonth()-1); if(curPage==="chart") renderChart(); else render(); }
function nextMonth(){ curYm.setMonth(curYm.getMonth()+1); if(curPage==="chart") renderChart(); else render(); }

document.getElementById("actionOverlay").onclick = function(e){ if(e.target===this) closeAction(); };
document.getElementById("editOverlay").onclick = function(e){ if(e.target===this) closeEdit(); };

render();
</script>
</body>
